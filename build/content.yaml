# ============================================================
# eCH Standard — Content Definition
# Chapters and appendices can reference .adoc files directly.
# The adoc parser handles headings, paragraphs, lists, tables,
# images, bold/italic inline formatting, and role annotations.
# ============================================================

metadata:
  ech_nummer:       "eCH-0XXX"
  title:            "Titel des Standards"
  version:          "x.x.x"
  status:           "Entwurf"
  kategorie:        "Standard"
  reifegrad:        "Stabil"
  beschluss:        "JJJJ-MM-TT"
  ausgabe:          "JJJJ-MM-TT"
  ersetzt_version:  "x.x.x"
  ersetzt_status:   "Aufgehoben"
  voraussetzungen:  "<Vorausgesetzter Standard>"
  beilagen:         "<Beilage>"
  sprachen:         "Deutsch (Original), Französisch (Übersetzung)"
  fachgruppe:       "<Fachgruppe>"
  herausgeber:      "Verein eCH, Affolternstrasse 52, 8050 Zürich"
  kontakt:          "T 044 388 74 64 / info@ech.ch / www.ech.ch"
  zusammenfassung:  "<Kurze Zusammenfassung des Zwecks des Dokuments>"

hinweis_file: docs/hinweis.adoc

chapters:
  - type: adoc_file
    file: docs/chapters/01-einleitung.adoc

  - type: adoc_file
    file: docs/chapters/02-hauptteil.adoc

  - type: adoc_file
    file: docs/chapters/03-sicherheit.adoc

  - type: adoc_file
    file: docs/chapters/04-haftung.adoc

  - type: adoc_file
    file: docs/chapters/05-urheberrecht.adoc

appendices:
  - title: "Referenzen & Bibliographie"
    adoc_file: docs/appendices/anhang-a-referenzen.adoc

  - title: "Mitarbeit & Überprüfung"
    adoc_file: docs/appendices/anhang-b-mitarbeit.adoc

  - title: "Abkürzungen und Glossar"
    adoc_file: docs/appendices/anhang-c-glossar.adoc

  - title: "Änderungen gegenüber Vorversion"
    adoc_file: docs/appendices/anhang-d-aenderungen.adoc

  - title: "Abbildungsverzeichnis"
    type: abbildungsverzeichnis

  - title: "Tabellenverzeichnis"
    type: tabellenverzeichnis
