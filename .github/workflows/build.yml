name: Build eCH Standard

on:
  workflow_dispatch:

# Write access needed to commit build output back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install toolchain ─────────────────────────────────────
      - name: Install Asciidoctor
        run: |
          gem install asciidoctor
          gem install asciidoctor-pdf
          asciidoctor --version
          asciidoctor-pdf --version

      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          pandoc --version

      # ── Generate HTML ─────────────────────────────────────────
      - name: Build HTML
        run: |
          asciidoctor \
            --backend html5 \
            --destination-dir build \
            --attribute toc-placement=left \
            --attribute source-highlighter=highlight.js \
            docs/index.adoc
          cp -r docs/images build/images

      # ── Generate DocBook XML (intermediate for Word) ──────────
      - name: Build DocBook XML
        run: |
          asciidoctor \
            --backend docbook5 \
            --destination-dir build \
            docs/index.adoc

      # ── Convert DocBook → Word via Pandoc ────────────────────
      # Uses the original eCH .docx as style reference so headings,
      # fonts and colours match the official template.
      - name: Build Word (.docx)
        run: |
          pandoc \
            --from docbook \
            --to docx \
            --reference-doc build/ech-reference.docx \
            --toc \
            --toc-depth 5 \
            --output build/index.docx \
            build/index.xml

      # ── Remove intermediate DocBook XML ──────────────────────
      - name: Clean up intermediate files
        run: rm -f build/index.xml

      # ── Commit build output back to the repository ────────────
      - name: Commit build output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/index.html build/index.docx build/images/
          git diff --cached --quiet || git commit -m "ci: build HTML and Word [skip ci]"
          git push
