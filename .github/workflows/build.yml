name: Build eCH Standard

on:
  workflow_dispatch:

# Write access needed to commit build output back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install toolchain ─────────────────────────────────────
      - name: Install Asciidoctor
        run: |
          sudo gem install asciidoctor
          asciidoctor --version

      - name: Install Python dependencies
        run: pip install python-docx lxml pyyaml

      # ── Generate HTML ─────────────────────────────────────────
      - name: Build HTML
        run: |
          asciidoctor \
            --backend html5 \
            --destination-dir build \
            --attribute toc-placement=left \
            --attribute source-highlighter=highlight.js \
            docs/index.adoc
          cp -r docs/images build/images

      # ── Generate Word (.docx) via Python script ───────────────
      # Clones the reference template and rebuilds the body using
      # exact eCH styles — faithful to the original template.
      - name: Build Word (.docx)
        run: |
          python3 build/scripts/generate_docx.py \
            --reference build/ech-reference.docx \
            --content   build/content.yaml \
            --output    build/index.docx \
            --images    docs/images

      # ── Commit build output back to the repository ────────────
      - name: Commit build output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/index.html build/index.docx build/images/
          git diff --cached --quiet || git commit -m "ci: build HTML and Word [skip ci]"
          git push
